name: Verify Build on PR

"on":
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: oddwarrior/panasonic-ac-frontend:test
          cache-from: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache
          cache-to: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache,mode=max
