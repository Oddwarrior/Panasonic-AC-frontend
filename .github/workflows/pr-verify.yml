name: Verify Build on PR

"on":
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy Vulnerability Scanner (Non-Blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: oddwarrior/panasonic-ac-frontend:test
          cache-from: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache
          cache-to: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache,mode=max

      - name: Test Docker Image
        run: |
          # Start the container in the background on port 8080
          docker run -d -p 8080:80 --name app-test oddwarrior/panasonic-ac-frontend:test
          
          # Give Nginx a few seconds to boot
          sleep 5
          
          # Ping the server to verify it returns a 200 OK status
          if curl -s -f -o /dev/null http://localhost:8080; then
            echo "✅ Container is running and serving content successfully!"
          else
            echo "❌ Container failed to serve content!"
            docker logs app-test
            exit 1
          fi
          
          # Clean up
          docker rm -f app-test
