name: Build and Push on PR Merge

"on":
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract Release Version
        id: pkg
        if: startsWith(github.event.pull_request.head.ref, 'release-please--')
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: oddwarrior/panasonic-ac-frontend
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=pr
            ${{ steps.pkg.outputs.version != '' && format('type=raw,value={0}', steps.pkg.outputs.version) || '' }}
            ${{ steps.pkg.outputs.version != '' && 'type=raw,value=latest' || '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache
          cache-to: type=registry,ref=oddwarrior/panasonic-ac-frontend:buildcache,mode=max

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Docker Image Published!**\n\nThe following tags have been built and pushed to Docker Hub:\n```text\n${{ steps.meta.outputs.tags }}\n```'
            })
